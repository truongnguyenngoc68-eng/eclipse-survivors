<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="icon" type="image/png" href="/assets/beasts/dragon_u3.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet" />
    <title>Kỵ Sĩ Lam Kiếm — Hội Triệu Hồi Idle RPG Fantasy</title>
    <style>
      * {
        box-sizing: border-box;
        user-select: none;
        -webkit-user-select: none;
        font-family: 'Be Vietnam Pro', 'Segoe UI', system-ui, -apple-system, sans-serif;
        font-variant-numeric: tabular-nums;
      }
      html, body, #root {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #120d0a;
        font-family: 'Be Vietnam Pro', 'Segoe UI', system-ui, -apple-system, sans-serif;
        color: #F8FAFC;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }
      canvas {
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }
      button:focus-visible {
        outline: 2px solid #38BDF8 !important;
        outline-offset: 2px !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
